<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#06B6D4" />
    <meta name="description" content="KHOTWATI (خطوتي) - One Step at a Time. Complete anonymous habit recovery, addiction support, and public community platform." />
    
    <title>KHOTWATI | خطوتي - One Step at a Time</title>
    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('[KHOTWATI PWA] Service worker registered:', reg.scope))
            .catch((err) => console.log('[KHOTWATI PWA] Service worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
